[project]
name = "bricoram-decision-analytics"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pgserver>=0.1.4",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "sqlfluff>=4.5.0",
    "sqlglot>=30.33.0",
    "tzdata>=2026.6",
]

[tool.ruff]
line-length = 110
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
# Intentional Unicode: French typography, en dashes, and no-break spaces the price regex must match.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
