# Reviewer path: `docker compose up -d` then
#   DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/postgres uv run python scripts/db.py init
services:
  db:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
