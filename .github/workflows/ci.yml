name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      BRICORAM_RO_PASSWORD: ci-only-ro-password
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"   # same as local, so uv.lock is read identically

      - name: Install dependencies (locked)
        run: uv sync --locked

      - name: Lint Python
        run: uv run ruff check scripts tests hooks

      - name: Lint SQL
        run: uv run python -m sqlfluff lint sql db

      - name: Tests (security, hooks, geography, traps, SQL reconciliation)
        run: uv run pytest -q

      - name: Public price-guide audit (informational)
        # Bricoram's live guide has known errors (evidence/2026-11-22); this step shows
        # how the same audit would gate a publish job with --fail-on-error.
        run: uv run python scripts/audit_public_prices.py audit evidence/2026-11-22/prices.csv

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
